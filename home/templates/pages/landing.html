{{define "content"}}
<h1>Aplicações</h1>

{{if not .Apps}}
<div class="cae-card">
    <p>Ainda não tem acesso a nenhuma aplicação. Contacte um administrador.</p>
</div>
{{else}}
<div class="cae-app-grid">
    {{range .Apps}}
    <a class="cae-app-card" href="{{.Path}}">
        <h3>{{if .Icon}}{{.Icon}} {{end}}{{.Label}}</h3>
        <p>{{.Path}}</p>
    </a>
    {{end}}
</div>
{{end}}
{{end}}
